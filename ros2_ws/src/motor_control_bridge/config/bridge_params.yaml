motor_control_bridge:
  ros__parameters:

    # Hardware — change per machine / wiring
    serial_port: /dev/ttyUSB1  # Nano; lidar occupies /dev/ttyUSB0
    baud_rate: 57600

    # Physical geometry — must match the robot's build
    track_width: 0.15  # TODO: calibrate; distance between wheel contact points (m)

    # Motion slices — each continuous Nav2 velocity command is broken into
    # discrete firmware commands of this size
    slice_distance: 0.05  # m per forward/backward command
    slice_angle: 0.10     # rad per in-place rotation command

    # Deadband — below these thresholds the intent is treated as stop
    angular_threshold: 0.05  # rad/s
    linear_threshold: 0.02   # m/s
